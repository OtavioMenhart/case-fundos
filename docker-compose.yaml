services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "PwdSql123"
    volumes:
      - sqlserver_data:/var/opt/mssql
  
  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: "PwdSeq123"
    volumes:
      - seq_data:/data
    ports:
      - "5341:5341"
      - "8081:80"

volumes:
  sqlserver_data:
  seq_data:
